<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FARK Web Component Demo (&lt;fark-study-deck&gt;)</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5fa;
      color: #22243b;
    }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { color: #575a75; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
    code { background: #e8e8f5; padding: 2px 6px; border-radius: 5px; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1><code>&lt;fark-study-deck&gt;</code> Embed Demo</h1>
    <p>
      Drop a standalone, zero-dependency FARK Web Component into any static site, LMS lesson,
      or local HTML file. Supports inline <code>{{cloze}}</code> blanks, SM-2 / Leitner presets,
      and emits <code>fark-review</code> DOM events without external requests or tracking.
    </p>

    <fark-study-deck id="demo-widget">
      <script type="application/json">
        {
          "format": "fark-study-deck",
          "version": 1,
          "cards": [
            {
              "id": "embed-1",
              "topic": "Algorithms",
              "question": "Binary search needs a {{sorted}} array and runs in {{O(log n)}} time.",
              "answer": "sorted; O(log n)",
              "box": 0,
              "dueAt": null,
              "lastReviewedAt": null,
              "reviews": 0,
              "correct": 0,
              "lapses": 0
            },
            {
              "id": "embed-2",
              "topic": "Biology",
              "question": "Which organelle generates ATP via oxidative phosphorylation?",
              "answer": "Mitochondrion",
              "box": 0,
              "dueAt": null,
              "lastReviewedAt": null,
              "reviews": 0,
              "correct": 0,
              "lapses": 0
            }
          ]
        }
      </script>
    </fark-study-deck>
  </main>

  <script type="module">
    import { registerFarkWidget } from '../src/widget.js';
    registerFarkWidget();
    document.getElementById('demo-widget')?.setStrategy('sm2');
  </script>
</body>
</html>
